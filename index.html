  lines(document.getElementById('ch-acum'), ser.map(d=>MES[+d.ym.slice(5)-1]+'/'+d.ym.slice(2,4)), [
    { name:'Cheque acumulado', short:'Cheque', color:'var(--s1)', values:ser.map(d=>d.chequeAcum) },
    { name:'Incorrido acumulado', short:'Incorrido', color:'var(--s3)', values:ser.map(d=>d.acum), area:true },
  ], { h: isMob()?240:300, ref:k.orcExe, refLabel:'orçamento '+money(k.orcExe), fmtAxis:axisMoney, fmtLabel:v=>money(v), fmtTip:v=>money(v), tipExtra:i=>`<div><b>Saldo: ${money(ser[i].saldo)}</b></div>`, aria:'Custo incorrido acumulado comparado ao cheque acumulado' });
  drawAvanco(o, k);
}


function drawAvanco(o, k){
  const el = document.getElementById('ch-av'); if (!el) return;
  const ms = k.serie.map(d=>d.ym);
  const series = [
    { name:'Avanço físico', short:'Físico', color:'var(--s1)', values: ms.map(m => (o.avancos||{})[m]?.fisico ?? null) },
    { name:'Avanço fís/fin', short:'Fís/fin', color:'var(--s2)', values: ms.map(m => (o.avancos||{})[m]?.fisfin ?? null) },
    { name:'Custo incorrido (% executivo)', short:'Custo', color:'var(--s3)', values: k.serie.map(d => d.acum/(k.orcExe||1)) },
  ];
  document.getElementById('leg-av').innerHTML = legendHtml(series.map(s=>({name:s.name,color:s.color,line:true})));
  lines(el, ms.map(m=>MES[+m.slice(5)-1]+'/'+m.slice(2,4)), series, { h: isMob()?220:260, max:1, fmtAxis:v=>Math.round(v*100)+'%', fmtLabel:v=>pct(v,1), fmtTip:v=>pct(v,1), aria:'Avanço físico, fís/fin e custo incorrido ao longo da obra' });
}

/* ---------- ORÇAMENTO E OBRA ---------- */
function renderOrcamento(el){
  const o = obra();
  const usados = new Set(); for (const m in o.gasto||{}) for (const c in o.gasto[m]) usados.add(c);
  const total = o.categorias.reduce((s,c)=>s+orcOf(c),0);
  el.innerHTML = `
  <div class="pg-title"><span class="eyebrow">${esc(o.nome)} · cadastro</span><h2 class="sec">Orçamento e obra</h2><p class="lead">Dados fixos da obra e o orçamento executivo por categoria (nível de 11 dígitos). É daqui que o painel calcula cheque, estouro e economia.</p></div>
  <section class="panel">
    <form id="f-obra" class="grid-form">
      <div class="field wide"><label for="ob-nome">Nome da obra</label><input id="ob-nome" value="${esc(o.nome)}" required></div>
      <div class="field"><label for="ob-ini">Início</label><input id="ob-ini" type="month" value="${esc((o.inicio||'').slice(0,7))}" required></div>
      <div class="field"><label for="ob-fim">Término previsto</label><input id="ob-fim" type="month" value="${esc((o.fim||'').slice(0,7))}" required></div>
      <div class="field"><label for="ob-viab">Viabilidade (R$)</label><input id="ob-viab" inputmode="decimal" value="${o.orcViab?nf2.format(o.orcViab):''}"></div>
      <button class="btn" type="submit">Salvar obra</button>
    </form>
    <p class="note muted">Prazo: ${monthsBetween((o.inicio||'').slice(0,7),(o.fim||'').slice(0,7)).length} meses · Orçamento executivo: <b>${money(total,false)}</b> · Cheque mensal: <b>${money(total/(monthsBetween((o.inicio||'').slice(0,7),(o.fim||'').slice(0,7)).length||1),false)}</b></p>
  </section>
  <div class="tbl-wrap"><table><thead><tr><th>Código</th><th>Categoria</th><th class="n">Equipamento</th><th class="n">Mão de obra</th><th class="n">Material</th><th class="n">Total</th><th>Fora do custo</th><th></th></tr></thead><tbody>
  ${o.categorias.map((c,i)=>`<tr><td><input class="cell txt" style="min-width:120px;font-family:var(--mono)" data-ci="${i}" data-k="id" value="${esc(c.id)}" aria-label="Código"></td><td><input class="cell txt" data-ci="${i}" data-k="nome" value="${esc(c.nome)}" aria-label="Categoria"></td>
  ${['eq','mo','mat'].map(f=>`<td><input class="cell" inputmode="decimal" data-ci="${i}" data-k="${f}" value="${nf2.format(+c[f]||0)}" aria-label="${f}"></td>`).join('')}
  <td class="n">${money(orcOf(c))}</td><td><input type="checkbox" data-ci="${i}" data-k="fora" ${c.fora?'checked':''} aria-label="Fora do custo da obra"></td>
  <td>${usados.has(c.id)?'':`<button class="x" data-del-cat="${i}" aria-label="Excluir categoria">✕</button>`}</td></tr>`).join('')}
  </tbody></table></div>
  <div class="toolbar"><button class="btn sec" id="cat-add">+ Adicionar categoria</button></div>
  <section class="panel">
    <h3 class="sub">Colar orçamento do Excel</h3>
    <p class="note">Copie as colunas <b>Nível · Atividade · Equipamento · Serviço · Material</b> (como na aba ORÇAMENTO) e cole abaixo. Códigos que já existem são atualizados; os novos são criados.</p>
    <textarea id="cola" rows="5" placeholder="01.01.01.01	PROJETOS	0	2859647,84	0"></textarea>
    <div class="toolbar"><button class="btn" id="cola-ok">Aplicar orçamento colado</button></div>
  </section>
  ${equipeHtml()}
  ${ehAdmin()?`<section class="panel"><h3 class="sub">Excluir obra</h3><p class="note">Apaga ${esc(o.nome)} e todos os lançamentos dela para toda a equipe.</p>
    <div class="toolbar">${UI.confirm==='delobra'?`<span class="inl-confirm">Excluir ${esc(o.nome)} de vez? <button class="btn danger" id="delobra-ok">Sim, excluir</button><button class="btn sec" id="confirm-no">Cancelar</button></span>`:`<button class="btn sec" id="delobra">Excluir esta obra</button>`}</div></section>`:''}`;
}

/* ---------- nova obra ---------- */
function abrirNovaObra(){
  document.getElementById('modal-root').innerHTML = `<div class="modal-bg"><form class="modal" id="f-nova" aria-label="Nova obra">
    <h2 class="sec">Nova obra</h2>
    <div class="field"><label for="no-nome">Nome</label><input id="no-nome" required placeholder="Residencial Vista Alegre"></div>
    <div class="grid-form" style="grid-template-columns:1fr 1fr"><div class="field"><label for="no-ini">Início</label><input id="no-ini" type="month" required value="${nowYM()}"></div><div class="field"><label for="no-fim">Término</label><input id="no-fim" type="month" required value="${addMonths(nowYM(),24)}"></div></div>
    <div class="field"><label for="no-viab">Orçamento de viabilidade (R$)</label><input id="no-viab" inputmode="decimal"></div>
    <label style="display:flex;gap:8px;align-items:center;font-size:13px"><input type="checkbox" id="no-copiar" checked> Usar as mesmas categorias da obra atual (valores zerados)</label>
    <div class="toolbar"><button class="btn" type="submit">Criar obra</button><button class="btn sec" type="button" id="no-cancel">Cancelar</button></div>
  </form></div>`;
  setTimeout(()=>document.getElementById('no-nome').focus());
}

/* ---------- eventos ---------- */
document.getElementById('sel-obra').addEventListener('change', e => { if (!e.target.value) return; S.atual = e.target.value; S.mes = null; UI.aberto=null; UI.imp=null; save(); render(); });
document.getElementById('sel-mes').addEventListener('change', e => { S.mes = e.target.value; save(); render(); });
document.getElementById('btn-nova').addEventListener('click', abrirNovaObra);
window.addEventListener('hashchange', () => { UI.confirm=null; UI.aberto=null; render(); window.scrollTo(0,0); });
let lastW = window.innerWidth, rzT;
window.addEventListener('resize', () => { clearTimeout(rzT); rzT = setTimeout(() => { if (Math.abs(window.innerWidth-lastW) < 40) return; lastW = window.innerWidth; if (view()!=='orcamento' && view()!=='lancar') { const y=window.scrollY; render(); window.scrollTo(0,y); } }, 200); });
mq.addEventListener?.('change', () => render());

function keepScroll(fn){ const y = window.scrollY; fn(); window.scrollTo(0,y); }
document.addEventListener('click', e => {
  if (e.target.closest('[data-stop]') && !e.target.closest('button')) return;
  const t = e.target.closest('button,tr.row,.ccard,input[type=checkbox]'); if (!t) return;
  const o = obra();
  if (t.id==='lg-modo') { UI.lgMail = document.getElementById('lg-mail')?.value || UI.lgMail; telaLogin('', UI.loginModo==='criar'?'entrar':'criar'); return; }
  if (t.dataset.aprovar) { const mail = t.dataset.aprovar, p = (UI.pedidos||[]).find(x=>x.email===mail); t.disabled = true;
    NUVEM.sb.from('go_membros').upsert({ email: mail, papel: t.dataset.como, nome: p?.nome||null }, { onConflict:'email' }).then(async ({error}) => {
      if (error) { toast(error.message); t.disabled = false; return; }
      await NUVEM.sb.from('go_solicitacoes').delete().eq('email', mail); toast(`${p?.nome||mail} liberado: ${PAPEL_TXT[t.dataset.como]}.`); carregarMembros(); }); return; }
  if (t.dataset.recusar) { NUVEM.sb.from('go_solicitacoes').delete().eq('email', t.dataset.recusar).then(({error}) => { if (error) toast(error.message); else { toast('Pedido recusado.'); carregarMembros(); } }); return; }
  if (t.id==='pd-check') { const u = NUVEM.user; NUVEM.user = null; entrar(u); return; }
  if (t.id==='sair') { NUVEM.sb?.auth.signOut(); return; }
  if (t.id==='imp-eth') { escolherDadosIniciais(); return; }
  if (t.id==='btn-nova2') { abrirNovaObra(); return; }
  if (t.dataset.rmembro) { NUVEM.sb.from('go_membros').delete().eq('email', t.dataset.rmembro).then(({error}) => { if (error) toast(error.message); else { toast('Acesso removido.'); carregarMembros(); } }); return; }
  if (t.id==='no-cancel') { document.getElementById('modal-root').innerHTML=''; return; }
  if (t.dataset.cm) { UI.chqModo = t.dataset.cm; document.querySelectorAll('[data-cm]').forEach(b=>b.setAttribute('aria-pressed', b===t)); drawCheque(calc(o,S.mes)); return; }
  if (t.dataset.cp) { UI.chqPer = t.dataset.cp; document.querySelectorAll('[data-cp]').forEach(b=>b.setAttribute('aria-pressed', b===t)); drawCheque(calc(o,S.mes)); return; }
  if (t.dataset.fm) { UI.fcModo = t.dataset.fm; document.querySelectorAll('[data-fm]').forEach(b=>b.setAttribute('aria-pressed', b===t)); drawForecast(o); return; }
  if (t.dataset.vm) { UI.catModo = t.dataset.vm; UI.aberto=null; keepScroll(render); return; }
  if (t.dataset.mid) { UI.abertoMes = UI.abertoMes===t.dataset.mid ? null : t.dataset.mid; keepScroll(render); return; }
  if (t.dataset.frm) { UI.frSel = t.dataset.frm; keepScroll(render); return; }
  if (t.dataset.fa) { const k=t.dataset.fa; UI.fornAberto.has(k)?UI.fornAberto.delete(k):UI.fornAberto.add(k); keepScroll(render); return; }
  if (t.dataset.vermes) { UI.catModo='mes'; UI.abertoMes=t.dataset.vermes; UI.buscaMes=''; render(); setTimeout(()=>document.querySelector(`[data-mid="${CSS.escape(t.dataset.vermes)}"]`)?.scrollIntoView({block:'start'}),30); return; }
  if (t.dataset.f) { UI.filtro = t.dataset.f; keepScroll(render); return; }
  if (t.id==='agrupar') { UI.agrupar = !UI.agrupar; keepScroll(render); return; }
  if (t.matches('tr.row,.ccard')) { UI.aberto = UI.aberto===t.dataset.id ? null : t.dataset.id; keepScroll(render); return; }
  if (t.dataset.goto) { S.mes = t.dataset.goto; save(); location.hash='#painel'; return; }
  if (t.dataset.irmes) { S.mes = t.dataset.irmes; save(); keepScroll(render); return; }
  if (t.id==='imp-cancel') { UI.imp=null; render(); return; }
  if (t.id==='imp-ok') { aplicarImport(); return; }
  if (t.id==='imp-all') { Object.keys(UI.imp.sel).forEach(m=>UI.imp.sel[m]=t.checked); document.getElementById('imp-res').innerHTML=impPreview(); return; }
  if (t.dataset.sel) { UI.imp.sel[t.dataset.sel]=t.checked; document.getElementById('imp-res').innerHTML=impPreview(); return; }
  if (t.dataset.delAj) { o.ajustes = o.ajustes.filter(a=>a.uid!==t.dataset.delAj); save(); render(); return; }
  if (t.dataset.inc || t.dataset.dec) { const k=t.dataset.inc||t.dataset.dec; setEf(k, getEf(k)+(t.dataset.inc?1:-1)); keepScroll(render); return; }
  if (t.dataset.inaf) { const f=o.funcoes.find(x=>x.id===t.dataset.inaf); if(f){ f.ativo=false; save(); toast(f.nome+' saiu da lista.'); keepScroll(render); } return; }
  if (t.dataset.inae) { const e2=o.empreiteiros.find(x=>x.id===t.dataset.inae); if(e2){ e2.ativo=false; save(); toast(e2.nome+' saiu da lista.'); keepScroll(render); } return; }
  if (t.id==='ef-copiar') { const pk = mesAnteriorComEfetivo(o, S.mes); if (pk) { UI.efDraft = deep(o.efetivo[pk]); toast('Copiado de '+ymLabel(pk)+'. Salve para gravar.'); keepScroll(render); } return; }
  if (t.id==='ef-salvar') { const r = { mop:{}, emp:{} }; for (const k in UI.efDraft.mop) if (+UI.efDraft.mop[k]) r.mop[k] = +UI.efDraft.mop[k]; for (const k in UI.efDraft.emp) if ((UI.efDraft.emp[k]||[]).some(v=>+v)) r.emp[k] = UI.efDraft.emp[k].map(v=>+v||0); (o.efetivo ??= {})[S.mes] = r; UI.efSaved = true; UI.efBase=''; save(); toast('Efetivo de '+ymLabel(S.mes)+' salvo.'); keepScroll(render); return; }
  if (t.id==='ef-zerar') { UI.efDraft = { mop:{}, emp:{} }; keepScroll(render); return; }
  if (t.id==='ef-ocultar') { UI.efSoComGente = !UI.efSoComGente; keepScroll(render); return; }
  if (t.id==='cat-add') { o.categorias.push({ id:'', nome:'NOVA CATEGORIA', eq:0, mo:0, mat:0 }); save(); render(); return; }
  if (t.dataset.delCat) { o.categorias.splice(+t.dataset.delCat,1); save(); render(); return; }
  if (t.id==='cola-ok') { colarOrcamento(); return; }
  if (t.id==='delobra') { UI.confirm='delobra'; render(); return; }
  if (t.id==='confirm-no') { UI.confirm=null; render(); return; }
  if (t.id==='delobra-ok') { NUVEM.apagar.push(o.id); delete S.obras[o.id]; S.atual = Object.keys(S.obras)[0]; S.mes=null; UI.confirm=null; save(); location.hash='#painel'; render(); return; }
});
document.addEventListener('keydown', e => { if ((e.key==='Enter'||e.key===' ') && e.target.matches('tr.row,.ccard')) { e.preventDefault(); e.target.click(); } if (e.key==='Escape') document.getElementById('modal-root').innerHTML=''; });
document.addEventListener('input', e => {
  if (e.target.id==='busca') { UI.busca = e.target.value; const k = calc(obra(), S.mes); document.getElementById('cat-list').innerHTML = catList(k); if (UI.aberto) drawDetalhe(k); }
  if (e.target.id==='busca-mes') { UI.buscaMes = e.target.value; clearTimeout(UI.bmT); UI.bmT = setTimeout(()=>{ const pos=e.target.selectionStart; keepScroll(render); const i=document.getElementById('busca-mes'); if(i){ i.focus(); try{i.setSelectionRange(pos,pos)}catch(_){} } }, 250); }
  if (e.target.dataset.ef) { setEf(e.target.dataset.ef, parseInt(e.target.value)||0); }
});
document.addEventListener('change', e => {
  const t = e.target, o = obra();
  if (t.dataset.papel) { NUVEM.sb.from('go_membros').update({ papel: t.value }).eq('email', t.dataset.papel).then(({error}) => { if (error) toast(error.message); else { toast('Acesso alterado: '+PAPEL_TXT[t.value]+'.'); carregarMembros(); } }); return; }
  if (t.id==='ordem') { UI.ordem = t.value; keepScroll(render); }
  if (t.id==='ordem-mes') { UI.ordemMes = t.value; keepScroll(render); }
  if (t.id==='hist-cat') { UI.histCat = t.value; keepScroll(render); }
  if (t.id==='arq' && t.files[0]) lerArquivo(t.files[0]);
  if (t.dataset.map!=null && UI.imp) { UI.imp.map[t.dataset.map] = t.value; }
  if (t.dataset.ef) keepScroll(render);
  if (t.dataset.ci!=null) { const c = o.categorias[+t.dataset.ci], k = t.dataset.k; if (k==='fora') c.fora = t.checked; else if (k==='id'||k==='nome') c[k] = t.value.trim().toUpperCase(); else c[k] = parseNum(t.value); save(); keepScroll(render); }
});
document.addEventListener('submit', e => {
  e.preventDefault(); const f = e.target, o = obra(), v = id => document.getElementById(id).value;
  if (f.id==='f-av') { const p = id => v(id).trim()==='' ? null : parseNum(v(id))/100, r = id => v(id).trim()==='' ? null : parseNum(v(id)); const a = { fisico:p('av-fis'), fisfin:p('av-ff'), finEst:p('av-fe'), meta:p('av-meta'), forecast:p('av-fc'), estoque:r('av-est'), execCorr:r('av-ec'), viabCorr:r('av-vc') }; Object.keys(a).forEach(k=>a[k]==null&&delete a[k]); (o.avancos ??= {})[S.mes] = a; save(); toast('Avanço de '+ymLabel(S.mes)+' salvo.'); render(); }
  if (f.id==='f-aj') { const val = parseNum(v('aj-val')); if (!val) { toast('Informe um valor.'); return; } (o.ajustes ??= []).push({ uid: Date.now().toString(36), ym:S.mes, cat:v('aj-cat'), tipo:v('aj-tipo'), valor:val, desc:v('aj-desc') }); save(); toast('Ajuste adicionado.'); render(); }
  if (f.id==='f-emp') { migrarEfetivo(o); o.empreiteiros.push({ id:'e'+Date.now().toString(36), nome:v('ne-nome').trim().toUpperCase(), atividade:capt(v('ne-ativ').trim()), ativo:true }); save(); toast('Empreiteiro adicionado.'); keepScroll(render); }
  if (f.id==='f-fun') { migrarEfetivo(o); o.funcoes.push({ id:'f'+Date.now().toString(36), nome:v('nf-nome').trim().toUpperCase(), ativo:true }); save(); toast('Função adicionada.'); keepScroll(render); }
  if (f.id==='f-obra') { o.nome=v('ob-nome').trim(); o.inicio=v('ob-ini')+'-01'; o.fim=v('ob-fim')+'-28'; o.orcViab=parseNum(v('ob-viab')); save(); toast('Dados da obra salvos.'); render(); }
  if (f.id==='f-login') { const mail = v('lg-mail').trim().toLowerCase(), senha = v('lg-senha'); const btn = f.querySelector('button'); btn.disabled = true; btn.textContent = 'Aguarde…'; UI.lgMail = mail;
    const criar = UI.loginModo==='criar';
    const req = criar ? NUVEM.sb.auth.signUp({ email: mail, password: senha }) : NUVEM.sb.auth.signInWithPassword({ email: mail, password: senha });
    req.then(({ data, error }) => {
      if (error) { const m = /invalid login/i.test(error.message) ? 'E-mail ou senha incorretos. Se é seu primeiro acesso, toque em "Primeiro acesso? Criar senha".' : (/already registered|already been registered/i.test(error.message) ? 'Esse e-mail já tem senha. Toque em "Já tenho senha: entrar".' : esc(error.message)); telaLogin(m); return; }
      if (data.session) entrar(data.session.user);
      else telaLogin('Senha criada. O Supabase pediu confirmação: abra o e-mail que chegou, confirme e depois entre aqui com a senha.', 'entrar');
    }).catch(err => telaLogin(esc(err.message||String(err)))); return; }
  if (f.id==='f-pedido') { const nome = v('pd-nome').trim(), u = NUVEM.user; f.querySelector('button').disabled = true;
    NUVEM.sb.from('go_solicitacoes').insert({ email: u.email.toLowerCase(), nome }).then(({error}) => telaPedido(u, error ? 'Não consegui enviar: '+esc(error.message) : '')); return; }
  if (f.id==='f-membro') { const mail = v('mb-mail').trim().toLowerCase();
    NUVEM.sb.from('go_membros').upsert({ email: mail, papel: v('mb-papel') }, { onConflict:'email' }).then(({error}) => { if (error) toast(error.message); else { toast('Acesso liberado para '+mail+'.'); carregarMembros(); } }); return; }
  if (!S || !obra() && f.id!=='f-nova') return;
  if (f.id==='f-nova') {
    const id = 'o'+Date.now().toString(36), base = obra() || { categorias:[], funcoes:[] };
    S.obras[id] = { id, nome:v('no-nome').trim(), inicio:v('no-ini')+'-01', fim:v('no-fim')+'-28', orcViab:parseNum(v('no-viab')), categorias: document.getElementById('no-copiar').checked ? base.categorias.map(c=>({ id:c.id, nome:c.nome, eq:0, mo:0, mat:0, fora:!!c.fora })) : [], gasto:{}, itens:{}, avancos:{}, ajustes:[], funcoes: (base.funcoes||[]).filter(f=>f.ativo).map(f=>({...f})), empreiteiros: [], efetivo:{} };
    S.atual = id; S.mes = null; UI.efMes=null; save(); document.getElementById('modal-root').innerHTML=''; location.hash = '#orcamento'; render(); toast('Obra criada. Agora preencha o orçamento.');
  }
});
document.addEventListener('dragover', e => { const d=e.target.closest&&e.target.closest('#drop'); if (d) { e.preventDefault(); d.classList.add('over'); } });
document.addEventListener('dragleave', e => { const d=e.target.closest&&e.target.closest('#drop'); if (d) d.classList.remove('over'); });
document.addEventListener('drop', e => { const d=e.target.closest&&e.target.closest('#drop'); if (d) { e.preventDefault(); d.classList.remove('over'); if (e.dataTransfer.files[0]) lerArquivo(e.dataTransfer.files[0]); } });

function colarOrcamento(){
  const o = obra(), txt = document.getElementById('cola').value.trim(); if (!txt) { toast('Cole as linhas do orçamento primeiro.'); return; }
  let n=0, novos=0;
  txt.split(/\r?\n/).forEach(l => { const p = l.split('\t'); if (p.length<3 || !/^\d{2}(\.\d{2}){3}/.test(p[0].trim())) return; const id=p[0].trim().slice(0,11); let c = o.categorias.find(x=>x.id===id); if (!c) { c={id}; o.categorias.push(c); novos++; } c.nome=(p[1]||c.nome||id).trim().toUpperCase(); c.eq=parseNum(p[2]); c.mo=parseNum(p[3]); c.mat=parseNum(p[4]); n++; });
  if (!n) { toast('Nenhuma linha reconhecida. A primeira coluna precisa ser o código (ex. 01.01.03.01).'); return; }
  o.categorias.sort((a,b)=>a.id.localeCompare(b.id)); save(); toast(n+' categorias aplicadas ('+novos+' novas).'); render();
}

iniciar();
